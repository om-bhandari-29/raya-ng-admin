<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  (onRefresh)="loadItems()"
  (onEdit)="openEditModal($any($event).id)"
  (onDelete)="deleteGroupItem($any($event).id)"
  (onLike)="toggleLiked($any($event))"
>
  <ng-template slot="id" let-item>
    <button
      (click)="openEditModal(item.id)"
      class="font-semibold hover:underline"
      style="color: #383838"
    >
      {{ item.name }}
    </button>
  </ng-template>
</app-table-layout>
