<app-table-layout
  [columns]="columns"
  [data]="items()"
  [addButtonText]="'Add Item Group'"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  (onAdd)="openAddModal()"
  (onRefresh)="loadItems()"
  (onEdit)="openEditModal($any($event).id)"
  (onDelete)="deleteGroupItem($any($event).id)"
  (onLike)="toggleLiked($any($event))"
>
  <ng-template slot="id" let-item>
    <button (click)="openEditModal(item.id)" class="text-blue-600 hover:text-blue-800 font-medium">
      {{ item.name_frappe_based_id }}
    </button>
  </ng-template>
</app-table-layout>
