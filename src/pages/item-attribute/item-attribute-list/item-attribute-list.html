<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  (onRefresh)="loadItems()"
  (onEdit)="openEdit($any($event).id)"
  (onDelete)="delete($any($event).id)"
>
  <ng-template slot="id" let-item>
    <button
      (click)="openEdit(item.id)"
      class="font-semibold hover:underline"
      style="color: #383838"
    >
      {{ item.name }}
    </button>
  </ng-template>
</app-table-layout>
