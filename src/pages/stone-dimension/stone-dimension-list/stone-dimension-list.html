<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  [showPagination]="true"
  [meta]="meta()"
  [searchPlaceholder]="'Search by ID...'"
  (onRefresh)="loadItems()"
  (onRowClick)="openEditModal($any($event).id)"
  (onEdit)="openEditModal($any($event).id)"
  (onDelete)="deleteItem($any($event).id)"
  (onPageChange)="onPageChange($event)"
  (onSearch)="onSearchChange($event)"
>
</app-table-layout>
