<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  [showPagination]="true"
  [currentPage]="currentPage()"
  [pageSize]="pageSize()"
  [totalPages]="totalPages()"
  [searchPlaceholder]="'Search by ID...'"
  (onRefresh)="loadItems()"
  (onRowClick)="openEditModal($any($event).generatedKey)"
  (onEdit)="openEditModal($any($event).generatedKey)"
  (onDelete)="deleteItem($any($event).id)"
  (onPageChange)="onPageChange($event)"
  (onSearch)="onSearchChange($event)"
>
</app-table-layout>
