<app-table-layout
  [columns]="columns"
  [data]="items()"
  [addButtonText]="'Add Stone Dimension'"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  (onAdd)="openAddModal()"
  (onRefresh)="loadItems()"
  (onRowClick)="openEditModal($any($event).id)"
  (onEdit)="openEditModal($any($event).id)"
  (onDelete)="deleteItem($any($event).id)">
</app-table-layout>
