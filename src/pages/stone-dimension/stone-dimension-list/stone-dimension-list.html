<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  (onRefresh)="loadItems()"
  (onRowClick)="openEditModal($any($event).id)"
  (onEdit)="openEditModal($any($event).id)"
  (onDelete)="deleteItem($any($event).id)"
>
</app-table-layout>
