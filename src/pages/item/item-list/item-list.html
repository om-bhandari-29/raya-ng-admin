<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  (onRefresh)="loadItems()"
  (onEdit)="openEdit($any($event).id)"
  (onDelete)="deleteItem($any($event).id)"
>
  <!-- Custom template for ID column (clickable link) -->
  <ng-template slot="id" let-item>
    <button (click)="openEdit(item.id)" class="text-blue-600 hover:text-blue-800 font-medium">
      {{ item.name }}
    </button>
  </ng-template>

  <!-- Custom template for Is Active (inverted logic) -->
  <ng-template slot="is_active" let-item>
    @if (!item.is_disabled) {
      <i class="bx bx-check text-xl text-green-600"></i>
    } @else {
      <span class="text-gray-400">-</span>
    }
  </ng-template>
</app-table-layout>
