<!-- Error Banner -->
@if (errorMessage()) {
  <div
    class="flex items-center gap-2 px-4 py-3 mb-4 rounded-lg text-sm text-red-600 bg-red-50 border border-red-200"
  >
    <svg class="h-4 w-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path
        fill-rule="evenodd"
        d="M10 18a8 8 0 100-16 8 8 0 000 16zm-.75-11.25a.75.75 0 011.5 0v4.5a.75.75 0 01-1.5 0v-4.5zm.75 7.5a.75.75 0 100-1.5.75.75 0 000 1.5z"
        clip-rule="evenodd"
      />
    </svg>
    {{ errorMessage() }}
  </div>
}

<!-- Card -->
<div class="bg-white rounded-xl border border-slate-200">
  <!-- Loading -->
  @if (isLoading()) {
    <div class="flex items-center justify-center gap-2 px-6 py-10 text-slate-400 text-sm">
      <svg
        class="animate-spin h-5 w-5"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      Loading...
    </div>
  }

  <!-- Form -->
  @if (!isLoading()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="px-6 py-5 space-y-5">
        <!-- HSN Code -->
        <div class="flex flex-col gap-1.5 w-1/2">
          <label for="hsn_code" class="font-medium" style="font-size: 13px; color: #525252">
            HSN Code <span class="text-red-500">*</span>
          </label>
          <input
            id="hsn_code"
            type="text"
            formControlName="hsn_code"
            placeholder="e.g. 8471"
            class="w-full rounded-lg px-2 py-1 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-2 focus:ring-gray-200 focus:border-gray-200 bg-[#f3f3f3]"
            [class.border-red-400]="hsnCodeControl.invalid && hsnCodeControl.touched"
            [class.border-slate-300]="!(hsnCodeControl.invalid && hsnCodeControl.touched)"
          />
          @if (hsnCodeControl.invalid && hsnCodeControl.touched) {
            <p class="text-xs text-red-500">HSN Code is required.</p>
          }
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1.5">
          <label for="description" class="font-medium" style="font-size: 13px; color: #525252">
            Description <span class="text-red-500">*</span>
          </label>
          <textarea
            id="description"
            formControlName="description"
            rows="3"
            placeholder="Enter description"
            class="w-full rounded-lg px-2 py-1 text-sm text-slate-800 placeholder-slate-400 outline-none transition focus:ring-2 focus:ring-gray-200 focus:border-gray-200 bg-[#f3f3f3] resize-none"
            [class.border-red-400]="descriptionControl.invalid && descriptionControl.touched"
            [class.border-slate-300]="!(descriptionControl.invalid && descriptionControl.touched)"
          ></textarea>
          @if (descriptionControl.invalid && descriptionControl.touched) {
            <p class="text-xs text-red-500">Description is required.</p>
          }
        </div>
      </div>
    </form>
  }
</div>
