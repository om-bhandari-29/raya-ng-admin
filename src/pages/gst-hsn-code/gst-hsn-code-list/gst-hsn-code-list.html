<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  [showPagination]="true"
  [currentPage]="currentPage()"
  [pageSize]="pageSize()"
  [totalPages]="totalPages()"
  (onRefresh)="loadItems()"
  (onEdit)="openEditModal($any($event).name)"
  (onPageChange)="onPageChange($event)"
>
</app-table-layout>
