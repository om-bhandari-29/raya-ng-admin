<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  [showPagination]="true"
  [currentPage]="currentPage()"
  [pageSize]="pageSize()"
  [totalPages]="totalPages()"
  [searchPlaceholder]="'Search by name...'"
  (onRefresh)="loadItems()"
  (onEdit)="openEditModal($any($event).name)"
  (onDelete)="deleteItem($any($event).id)"
  (onPageChange)="onPageChange($event)"
  (onSearch)="onSearchChange($event)"
>
  <ng-template slot="id" let-item>
    <button
      (click)="openEditModal(item.name)"
      class="font-semibold hover:underline"
      style="color: #383838"
    >
      {{ item.name }}
    </button>
  </ng-template>
</app-table-layout>
