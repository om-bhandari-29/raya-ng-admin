<app-table-layout
  [columns]="columns"
  [data]="items()"
  [isLoading]="isLoading()"
  [errorMessage]="errorMessage()"
  (onRefresh)="loadItems()"
  (onRowClick)="openEditModal($any($event).name)"
  (onEdit)="openEditModal($any($event).name)"
  (onDelete)="delete($any($event).name)"
>
</app-table-layout>
