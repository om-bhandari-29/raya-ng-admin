<div class="relative w-full">
  @if (label()) {
    <label class="block text-sm font-medium text-gray-700 mb-1">{{ label() }}</label>
  }

  <div class="relative">
    <input
      type="text"
      [value]="searchText()"
      (input)="onSearchChange($any($event.target).value)"
      (focus)="onFocus()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      class="w-full rounded-lg px-2 py-1 pr-8 text-sm text-slate-800 outline-none bg-[#f3f3f3] transition focus:ring-2 focus:ring-gray-200 focus:border-gray-200 disabled:cursor-not-allowed"
    />

    @if (selected()) {
      <button
        type="button"
        (click)="clear()"
        class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
      >
        ✕
      </button>
    }
  </div>

  @if (isOpen()) {
    <div
      class="absolute z-50 mt-1 w-full max-h-60 overflow-auto rounded-md border border-gray-200 bg-white shadow-lg"
    >
      @if (loading()) {
        <div class="px-3 py-2 text-sm text-gray-500">Loading...</div>
      } @else if (items().length === 0) {
        <div class="px-3 py-2 text-sm text-gray-500">No results found</div>
      } @else {
        @for (item of items(); track item.id) {
          <div
            (click)="selectItem(item)"
            class="cursor-pointer px-3 py-2 text-sm hover:bg-blue-50 transition-colors"
            [class.bg-blue-100]="selected()?.id === item.id"
          >
            {{ item.name }}
          </div>
        }
      }
    </div>
  }
</div>
