<aside id="top-bar-sidebar"
    class="fixed top-[57px] left-0 z-40 w-64 h-[calc(100vh-57px)] transition-transform -translate-x-full sm:translate-x-0 shadow-md"
    aria-label="Sidebar">
    <div class="h-full px-3 py-4 bg-slate-100 border-e border-slate-200">
        <a href="https://flowbite.com/" class="flex items-center ps-2.5 mb-5">
            <img src="https://flowbite.com/docs/images/logo.svg" class="h-6 me-3" alt="Flowbite Logo" />
            <span class="self-center text-lg text-heading font-semibold whitespace-nowrap">Flowbite</span>
        </a>
        <ul class="space-y-2 font-medium">
            @for (item of menuItems(); track $index) {
            <li>
                <a [routerLink]="item.route" routerLinkActive="bg-blue-100 text-blue-900 font-medium border-l-4 border-blue-900"
                    class="flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
                    <i class="text-xl" [ngClass]="item.icon"></i>
                    <span class="ms-3">{{item.name}}</span>
                </a>
            </li>
            }
        </ul>
    </div>
</aside>
